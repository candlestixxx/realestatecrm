name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build-main:
    name: Build Main CRM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build

  build-submodules:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: build-main
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: leadg
            dir: apps/leadg
            install: npm ci --legacy-peer-deps
            prebuild: npx prisma generate
            build: npm run build
          - app: media-workflow
            dir: apps/media-workflow
            install: npm ci --legacy-peer-deps
            build: npm run build
          - app: contentplanner
            dir: apps/contentplanner
            # lockfile drift (dotenv/tsx/esbuild missing from lock): install, not ci
            install: npm install --legacy-peer-deps
            build: npm run build
          - app: foreclosureworkflow
            dir: apps/foreclosureworkflow
            install: npm ci --legacy-peer-deps
            build: npm run build
          - app: legacyleads-frontend
            dir: apps/legacyleads/frontend
            # lockfile was generated on Windows (pins win32 SWC): install, not ci
            install: npm install --legacy-peer-deps
            build: npm run build
          - app: aicrm
            dir: apps/aicrm
            install: npm ci --legacy-peer-deps
            prebuild: npx prisma generate
            build: npm run build
          - app: leadcaller
            dir: apps/leadcaller
            install: npm ci --legacy-peer-deps
            prebuild: npx prisma generate
            build: npm run build
    env:
      # Prisma apps only read DATABASE_URL at build/generate time in CI;
      # no real database is contacted during `next build` page-data collection.
      DATABASE_URL: 'file:./ci.db'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.install }}
      - name: Prebuild (Prisma generate, when needed)
        if: ${{ matrix.prebuild }}
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.prebuild }}
      - name: Build
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.build }}

  test-foreclosure-parsers:
    name: Foreclosure Parser Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # tzdata: Windows/zoneinfo parity - parsers use ZoneInfo("America/New_York")
      - run: pip install tzdata
      - run: python -m unittest discover -s scripts/pipelines/foreclosure -p "test_*.py" -v
