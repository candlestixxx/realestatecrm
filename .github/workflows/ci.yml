name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build-main:
    name: Build Main CRM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build

  build-submodules:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: build-main
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: leadg
            dir: apps/leadg
            install: npm ci --legacy-peer-deps
            build: npm run build
          - app: media-workflow
            dir: apps/media-workflow
            install: npm ci --legacy-peer-deps
            build: npm run build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.install }}
      - name: Build
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.build }}
